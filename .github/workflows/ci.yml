name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Тесты идут на двух версиях PHP: 8.3 (основная) и 8.4 (на хостинге выбрана 8.4). Стиль и статический анализ — на 8.3.
  tests-sqlite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    name: tests-sqlite (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, zip, pdo_sqlite, gd, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
        if: matrix.php == '8.3'
      # Статический анализ (Larastan): старые замечания — в phpstan-baseline.neon, CI ругается только на новые.
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
        if: matrix.php == '8.3'
      - run: php artisan test
      - run: composer audit

  tests-mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    name: tests-mysql (PHP ${{ matrix.php }})
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gifter_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: gifter_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, zip, pdo_mysql, gd, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      # Блокировки строк (lockForUpdate), числа и даты проверяются на MySQL, как на хостинге.
      - run: php artisan test
